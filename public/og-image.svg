<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="200" fill="#6366f1" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#8b5cf6" opacity="0.1"/>

  <!-- Note icon -->
  <g transform="translate(480, 140)">
    <rect x="0" y="0" width="240" height="280" rx="20" fill="url(#iconGradient)" opacity="0.2"/>
    <rect x="10" y="10" width="220" height="260" rx="15" fill="#1e293b" stroke="url(#iconGradient)" stroke-width="3"/>
    <!-- Lines representing text -->
    <rect x="35" y="50" width="150" height="12" rx="6" fill="#6366f1" opacity="0.8"/>
    <rect x="35" y="80" width="170" height="12" rx="6" fill="#8b5cf6" opacity="0.6"/>
    <rect x="35" y="110" width="120" height="12" rx="6" fill="#6366f1" opacity="0.5"/>
    <rect x="35" y="150" width="160" height="12" rx="6" fill="#8b5cf6" opacity="0.6"/>
    <rect x="35" y="180" width="140" height="12" rx="6" fill="#6366f1" opacity="0.5"/>
    <rect x="35" y="210" width="100" height="12" rx="6" fill="#8b5cf6" opacity="0.4"/>
  </g>

  <!-- App name -->
  <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="url(#textGradient)" text-anchor="middle">
    Backs Note
  </text>

  <!-- Tagline -->
  <text x="600" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#cbd5e1" text-anchor="middle">
    Notepad Online Gratuito
  </text>
</svg>
